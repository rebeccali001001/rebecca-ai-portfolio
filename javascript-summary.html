<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JavaScript Syntax Cheat Sheet</title><link rel="stylesheet" href="topic.css?v=20260913"><link rel="stylesheet" href="site-directory.css"><link rel="stylesheet" href="javascript-topic.css"><script defer src="sidebar.js?v=20260913-javascript"></script><style>.cheat section{margin:22px 0;scroll-margin-top:90px}.cheat table{width:100%;min-width:690px;border-collapse:collapse}.cheat .table{overflow:auto}.cheat th,.cheat td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid #29415a}.cheat th{color:var(--green);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.cheat td:first-child{color:#fff;font-weight:700}</style></head><body class="standard-topic has-site-directory js-topic" data-knowledge-type="syntax" data-page-title="Summary"><nav><div class="wrap"><a class="brand" href="syntax-overview.html">Rebecca <span>Forward-Deployed AI</span></a></div></nav><aside id="site-directory"></aside><main class="wrap detail-page cheat"><a class="back" href="javascript-overview.html">← JavaScript Overview</a><header class="hero"><div class="eyebrow">JAVASCRIPT · QUICK REFERENCE</div><h1>JavaScript Syntax Cheat Sheet</h1><p class="lede">A scan-friendly reference for the syntax most commonly used in modern web projects.</p></header><div class="js-layout"><div id="content"></div><nav class="on-page" id="toc"><b>Quick Reference</b></nav></div></main><script>const sections=[['Variables',[['Declare','const name = "Rebecca";'],['Reassign','let count = 0; count += 1;']]],['Types',[['Primitive','string, number, boolean, undefined, null, bigint, symbol'],['Objects','object, array, function'],['Inspect','typeof value']]],['Operators',[['Compare','===, !==, >, <, >=, <='],['Logic','&&, ||, !, ??, ?.'],['Math','+, -, *, /, %, **']]],['Conditions',[['if / else','if (ready) {} else {}'],['switch','switch (status) { case "done": break; }'],['Ternary','ready ? "Go" : "Wait"']]],['Loops',[['Values','for (const item of items) {}'],['Keys','for (const key in object) {}'],['While','while (condition) {}']]],['Functions',[['Declaration','function save(id) { return id; }'],['Arrow','const save = id => id;'],['Default','function greet(name = "Guest") {}']]],['Arrays',[['Create / index','const items = []; items[0];'],['Change','push, pop, shift, unshift, splice'],['Read','slice, includes, indexOf']]],['Objects',[['Create','const user = { name: "Rebecca" };'],['Read','user.name; user["name"];'],['Copy','const next = { ...user, role: "PM" };']]],['Strings',[['Template literal','`Hello ${name}`'],['Search','includes, startsWith, endsWith'],['Transform','slice, replaceAll, split, trim, toLowerCase']]],['Numbers',[['Convert','Number(), parseInt(), parseFloat()'],['Check','Number.isNaN(value)'],['Math','Math.round, floor, ceil, random, max, min']]],['Destructuring & Spread',[['Object','const { name, role = "PM" } = user;'],['Array','const [first, second] = items;'],['Rest','const { id, ...rest } = user;']]],['DOM',[['Select','querySelector, querySelectorAll, getElementById'],['Change','textContent, classList, setAttribute, append'],['Safety','Use textContent for untrusted text; avoid unsafe innerHTML.']]],['Events & Forms',[['Listen','button.addEventListener("click", handler)'],['Event','event.target, preventDefault(), stopPropagation()'],['Form','new FormData(form); input.value']]],['JSON & Modules',[['JSON','JSON.stringify(data); JSON.parse(text);'],['Named export','export { save }; import { save } from "./utils.js";'],['Default','export default App; import App from "./app.js";']]],['Errors & Async',[['Errors','try {} catch (error) {} finally {}'],['Promise','fetch(url).then(...).catch(...).finally(...)'],['Async','const data = await response.json();']]],['Fetch & Storage',[['GET','const response = await fetch("/api/users");'],['POST','fetch(url, { method: "POST", headers, body: JSON.stringify(data) })'],['Storage','localStorage.setItem(key, value); localStorage.getItem(key);']]],['Classes & Collections',[['Class','class Order { constructor(id) { this.id = id; } }'],['Map','map.set(key, value); map.get(key);'],['Set','set.add(value); set.has(value);']]],['Array methods',[['Transform','items.map(fn), items.filter(fn), items.reduce(fn, initial)'],['Search','items.find(fn), items.findIndex(fn), items.some(fn), items.every(fn)'],['Side effect','items.forEach(fn); sort() mutates the original array.']]],['Modern JavaScript',[['Useful defaults','const, arrow functions, template literals, destructuring'],['Safe access','user?.profile?.name ?? "Guest"'],['Project basics','modules, async/await, object shorthand, default parameters']]];const content=document.querySelector('#content'),toc=document.querySelector('#toc');sections.forEach(([title,rows])=>{const id=title.toLowerCase().replaceAll(/[^a-z]+/g,'-');content.insertAdjacentHTML('beforeend',`<section id="${id}" class="card wide"><h2>${title}</h2><div class="table"><table><thead><tr><th>Concept</th><th>Syntax / reminder</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td><code>${r[1]}</code></td></tr>`).join('')}</tbody></table></div></section>`);toc.insertAdjacentHTML('beforeend',`<a href="#${id}">${title}</a>`)});</script></body></html>
