  ['33 · Common Data Types',[['INT','整数','quantity INT'],['BIGINT','大整数','id BIGINT'],['DECIMAL(p,s)','精确小数','price DECIMAL(18,2)'],['NUMERIC(p,s)','精确小数','amount NUMERIC(18,2)'],['FLOAT','浮点数','rate FLOAT'],['VARCHAR(n)','可变长度文字','customer VARCHAR(100)'],['CHAR(n)','固定长度文字','country CHAR(2)'],['TEXT','长文本','remarks TEXT'],['DATE','日期','trade_date DATE'],['TIME','时间','trade_time TIME'],['TIMESTAMP','日期时间','created_at TIMESTAMP'],['BOOLEAN','True / False；部分数据库支持','is_active BOOLEAN']]],

  ['35 · ALTER TABLE',[['ALTER TABLE','修改表结构','ALTER TABLE customers …'],['ADD / ADD COLUMN','新增字段','ADD email VARCHAR(100)'],['DROP COLUMN','删除字段','DROP COLUMN email'],['RENAME COLUMN','重命名字段；支持情况依数据库而异','RENAME COLUMN old TO new']]],
  ['36 · DROP',[['DROP TABLE','删除表','DROP TABLE customers;'],['DROP VIEW','删除 View','DROP VIEW active_orders;'],['DROP INDEX','删除 Index','DROP INDEX idx_orders_status;']]],
  ['37 · VIEW',[['CREATE VIEW','创建虚拟表','CREATE VIEW active_orders AS SELECT …;'],['SELECT FROM view','查询 View','SELECT * FROM active_orders;'],['DROP VIEW','删除 View','DROP VIEW active_orders;']]],
  ['38 · INDEX',[['CREATE INDEX','创建索引','CREATE INDEX idx_orders_status ON orders(status);'],['CREATE UNIQUE INDEX','创建唯一索引','CREATE UNIQUE INDEX …'],['DROP INDEX','删除索引','DROP INDEX idx_orders_status;']],'<p class="callout">An index can help find data faster, but it also has storage and write costs.</p>'],

  ['48 · EXISTS vs IN',[['IN','匹配子查询返回的多个值','WHERE customer_id IN (SELECT customer_id FROM vip_customers)'],['EXISTS','判断相关子查询是否有结果','WHERE EXISTS (SELECT 1 FROM vip_customers v WHERE v.customer_id = orders.customer_id)']],'<p class="callout">Both can match against other data. Choose the form that makes your query clearest.</p>'],

  ['50 · Common Query Order',[['SELECT','what to return','SELECT columns'],['FROM','source','FROM table'],['JOIN','combine tables','JOIN other_table ON condition'],['WHERE','filter rows','WHERE condition'],['GROUP BY','group rows','GROUP BY columns'],['HAVING','filter grouped results','HAVING condition'],['ORDER BY','sort results','ORDER BY columns'],['LIMIT','restrict result count','LIMIT 10;']],'<pre><code>SELECT columns\nFROM table\nJOIN other_table ON condition\nWHERE condition\nGROUP BY columns\nHAVING condition\nORDER BY columns\nLIMIT 10;</code></pre>'],

  ['57 · Common SQL Symbols',[['*','所有列 / COUNT 所有行','SELECT * / COUNT(*)'],[',','分隔字段','SELECT a, b'],['.','表和字段分隔','orders.order_id'],["'…'",'字符串值',"'Copper'"],['()','函数、子查询或条件分组','SUM(amount)'],['% / _','LIKE 中任意字符序列 / 单个字符',"'App%' / 'A_'"],['= / <>','等于 / 不等于',"status <> 'Done'"],['> / < / >= / <=','比较','quantity >= 10'],['+ / - / * / /','算术','price * quantity']]],
  ['58 · SQL Dialects',[['PostgreSQL','常见开源关系数据库','LIMIT, ON CONFLICT'],['MySQL','常见开源关系数据库','LIMIT, ON DUPLICATE KEY UPDATE'],['SQL Server','Microsoft 关系数据库','TOP, SELECT INTO'],['Oracle','企业关系数据库','MERGE'],['SQLite','嵌入式关系数据库','compact local database']],'<p class="callout">SQL is broadly similar, but limiting syntax, date functions, upserts, and DDL details can differ by database.</p>']

  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const root=document.querySelector('#sections');
  root.innerHTML=D.map(([title,rows,extra])=>`<section class="summary-section" id="${slug(title)}" data-search="${esc([title,...rows.flat()].join(' '))}"><h2>${esc(title)}</h2><div class="table-wrap"><table><thead><tr><th>Syntax</th><th>Explanation</th><th>Sample</th></tr></thead><tbody>${rows.map(r=>`<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td><td><code>${esc(r[2])}</code></td></tr>`).join('')}</tbody></table></div>${extra||''}</section>`).join('');
  document.querySelector('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();root.querySelectorAll('.summary-section').forEach(s=>s.classList.toggle('is-hidden',!!q&&!s.dataset.search.toLowerCase().includes(q)));});
  })();
  </script>
</body>
</html>
