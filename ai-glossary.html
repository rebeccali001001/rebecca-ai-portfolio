 & Frameworks","Knowledge Order":22004,"Classification Reason":"The languages and frameworks commonly used to implement the frontend, backend, and AI product stack."},{"English Term":"FastAPI","中文":"FastAPI Python 接口框架","Simple English":"A modern Python framework for building APIs.","中文小白理解":"用 Python 快速构建 Web 接口的框架。","Source Raw File":"17-frontend-backend.md; 19-backend-technologies.md","Original Module/Topic":"19 / Backend Technologies","Knowledge Stage":"Build & Production","Knowledge Section":"22 · Development Languages & Frameworks","Knowledge Order":22005,"Classification Reason":"The languages and frameworks commonly used to implement the frontend, backend, and AI product stack."},{"English Term":"Express","中文":"Express Node.js 框架","Simple English":"A lightweight Node.js framework for building web servers and APIs.","中文小白理解":"用 Node.js 构建网页服务器和接口的轻量框架。","Source Raw File":"19-backend-technologies.md","Original Module/Topic":"19 / Backend Technologies","Knowledge Stage":"Build & Production","Knowledge Section":"22 · Development Languages & Frameworks","Knowledge Order":22006,"Classification Reason":"The languages and frameworks commonly used to implement the frontend, backend, and AI product stack."},{"English Term":"React","中文":"React 前端库","Simple English":"A JavaScript library for building user interfaces from reusable components.","中文小白理解":"用可复用组件构建网页界面的 JavaScript 库。","Source Raw File":"17-frontend-backend.md; 19-frontend-technologies.md","Original Module/Topic":"19 / Frontend Technologies","Knowledge Stage":"Build & Production","Knowledge Section":"22 · Development Languages & Frameworks","Knowledge Order":22007,"Classification Reason":"The languages and frameworks commonly used to implement the frontend, backend, and AI product stack."},{"English Term":"Next.js","中文":"Next.js Web 框架","Simple English":"A React-based framework for building web applications.","中文小白理解":"基于 React、用于构建 Web 应用的框架。","Source Raw File":"17-frontend-backend.md; 18-web-cloud-platforms.md; 19-frontend-technologies.md","Original Module/Topic":"19 / Frontend Technologies","Knowledge Stage":"Build & Production","Knowledge Section":"22 · Development Languages & Frameworks","Knowledge Order":22008,"Classification Reason":"The languages and frameworks commonly used to implement the frontend, backend, and AI product stack."},{"English Term":"Cache","中文":"缓存","Simple English":"Temporarily stored data used to avoid repeating expensive work.","中文小白理解":"把常用或已计算过的内容暂存起来，减少重复工作。","Source Raw File":"03-large-language-models.md; 05-kv-cache.md; 18-web-cloud-platforms.md; 19-data-technologies.md","Original Module/Topic":"19 / Backend Technologies","Knowledge Stage":"Build & Production","Knowledge Section":"20 · Software & Application Architecture","Knowledge Order":20015,"Classification Reason":"The ordinary software layers behind an AI product, from clients and servers to data stores and delivery."},{"English Term":"Data Pipeline","中文":"数据管道","Simple English":"A sequence for moving and processing data.","中文小白理解":"移动和处理数据的一系列步骤。","Source Raw File":"19-backend-technologies.md","Original Module/Topic":"19 / Data Technologies","Knowledge Stage":"Build & Production","Knowledge Section":"20 · Software & Application Architecture","Knowledge Order":20017,"Classification Reason":"The ordinary software layers behind an AI product, from clients and servers to data stores and delivery."},{"English Term":"SaaS","中文":"软件即服务","Simple English":"Software provided and operated as an online service.","中文小白理解":"不必自己安装和维护、通过网络使用的软件服务。","Source Raw File":"16-automation-platforms.md","Original Module/Topic":"19 / Product Services","Knowledge Stage":"Build & Production","Knowledge Section":"21 · Cloud & Application Deployment","Knowledge Order":21011,"Classification Reason":"The cloud and application platform concepts used to take software from a repository to accessible production infrastructure."}]</script>
<script>
(() => {
  const rows = JSON.parse(document.getElementById('glossary-data').textContent || '[]');
  const knowledgeMap = document.getElementById('knowledge-map');

  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

  const stages = [
    { key: 'Understand AI', part: 'PART I', title: 'Understand the AI', description: 'Start with the big picture: what AI is, what models are, how architectures work, and how capability is learned.' },
    { key: 'AI Runtime', part: 'PART II', title: 'How AI Works at Runtime', description: 'Follow a request from multimodal input through prompts, tokens, inference, external knowledge, tools, agents, and product behavior.' },
    { key: 'Build & Production', part: 'PART III', title: 'Build & Run AI Products', description: 'See the engineering layers that make AI useful in production: serving, evaluation, safety, deployment, software, cloud, and development.' },
  ];

  const sections = [
    { id: '00', stage: 'Understand AI', title: 'AI Big Picture', description: 'The broad concepts that answer “What is AI?” before the technical details begin.', flow: ['AI', 'Machine Learning', 'Deep Learning', 'Foundation Model', 'Generative AI', 'AI Product'] },
    { id: '01', stage: 'Understand AI', title: 'Models & Model Landscape', description: 'The model families, capabilities, providers, openness, and hosting choices behind modern AI.', flow: ['Model', 'Model Type', 'Model Family', 'Provider', 'Open / Local / Cloud'] },
    { id: '02', stage: 'Understand AI', title: 'Model Architecture', description: 'The internal structures that transform input signals into useful representations and outputs.', flow: ['Neural Network', 'Architecture', 'Layer', 'Parameters', 'Transformer', 'Attention', 'Specialized Architectures'] },
    { id: '03', stage: 'Understand AI', title: 'Training & Learning', description: 'The data, learning paradigms, objectives, optimization steps, and generalization patterns that create capability.', flow: ['Learning Paradigm', 'Training Data', 'Objective', 'Optimization', 'Generalization'] },
    { id: '04', stage: 'Understand AI', title: 'Model Adaptation & Alignment', description: 'How a broadly trained model is adapted to follow instructions, reflect preferences, and behave as intended.', flow: ['Base Model', 'Fine-Tuning', 'Instruction Tuning', 'Preference Learning', 'Alignment'] },
    { id: '05', stage: 'AI Runtime', title: 'User Input & Multimodal Input', description: 'The modalities users provide and the capabilities that turn text, images, audio, and video into model-ready signals.', flow: ['User Request', 'Text / Image / Audio / Video', 'Model-ready Representation'] },
    { id: '06', stage: 'AI Runtime', title: 'Prompt, Context & Instructions', description: 'The instructions, history, retrieved context, and tool results assembled before a model runs.', flow: ['System Prompt', 'User Prompt', 'Retrieved Context', 'Tool Results', 'Context Assembly', 'Context Window'] },
    { id: '07', stage: 'AI Runtime', title: 'Tokenization & Tokens', description: 'LLMs do not process sentences as human-readable text; input is converted into tokens before inference.', flow: ['Text', 'Tokenizer', 'Tokenization', 'Tokens', 'Token Sequence', 'Context Window', 'Model'] },
    { id: '08', stage: 'AI Runtime', title: 'Inference & Generation', description: 'What happens after context enters a model: scores, probabilities, token selection, and generated text, media, or code.', flow: ['Context', 'Model', 'Logits', 'Sampling', 'Output Tokens', 'Generated Output'] },
    { id: '09', stage: 'AI Runtime', title: 'Structured Output & Model Response', description: 'The bridge from model output to predictable data that an application can validate and use.', flow: ['Model Output', 'Structured Output', 'JSON', 'Schema Validation', 'Application'] },
    { id: '10', stage: 'AI Runtime', title: 'Embeddings & Representation', description: 'How meaning becomes vectors that can be compared, indexed, and stored for retrieval.', flow: ['Document / Text', 'Embedding Model', 'Embedding', 'Vector', 'Vector Index', 'Vector Database'] },
    { id: '11', stage: 'AI Runtime', title: 'Search, Retrieval & RAG', description: 'The external-knowledge pipeline from a document collection to relevant, reranked context for a model.', flow: ['Knowledge Base', 'Document', 'Chunk', 'Search', 'Retrieval', 'Reranking', 'RAG'] },
    { id: '12', stage: 'AI Runtime', title: 'Grounding, References & Citations', description: 'How an answer is anchored to evidence, evaluated for factual support, and connected back to sources.', flow: ['Retrieved Source', 'Grounding', 'Generated Answer', 'Citation'] },
    { id: '13', stage: 'AI Runtime', title: 'Tools & External Actions', description: 'The interfaces and protocols that let a model request capabilities, data, or actions outside the model.', flow: ['Model', 'Tool Calling', 'Tool / Function', 'API / MCP', 'External System', 'Tool Result', 'Model'] },
    { id: '14', stage: 'AI Runtime', title: 'AI Agents', description: 'The control-loop concepts that combine goals, state, planning, tools, memory, and observation into an acting system.', flow: ['Goal', 'Plan', 'Tool Call', 'Action', 'Observation', 'Update State', 'Repeat', 'Agent'] },
    { id: '15', stage: 'AI Runtime', title: 'AI Assistants, Coding Agents & AI Products', description: 'The product forms users encounter when models and agents become assistants, coding tools, browser agents, and workflows.', flow: ['LLM', 'Assistant', 'Agent', 'Coding Agent / Browser Agent', 'AI Product'] },
    { id: '16', stage: 'Build & Production', title: 'APIs, Model Serving & Runtime', description: 'The serving, hardware, memory, batching, optimization, and performance layers that run models in practice.', flow: ['Application', 'Model API', 'Inference Server', 'Runtime', 'GPU / CPU', 'Model', 'Response'] },
    { id: '17', stage: 'Build & Production', title: 'Evaluation & Testing', description: 'The metrics, experiments, functional tests, and failure handling used to learn whether an AI system works.', flow: ['System', 'Test Cases', 'Metrics', 'Human Evaluation', 'Release Decision'] },
    { id: '18', stage: 'Build & Production', title: 'Safety, Security & Governance', description: 'The safety, privacy, access, security, and governance controls that constrain and supervise AI behavior.', flow: ['Model Output', 'Guardrails', 'Security', 'Human Review', 'Responsible Use'] },
    { id: '19', stage: 'Build & Production', title: 'Deployment & Production AI', description: 'The path from opportunity and workflow fit to release, monitoring, adoption, and continuous improvement.', flow: ['Opportunity', 'Workflow', 'Build', 'Evaluate', 'Release', 'Deploy', 'Monitor', 'Improve'] },
    { id: '20', stage: 'Build & Production', title: 'Software & Application Architecture', description: 'The ordinary software layers behind an AI product, from clients and servers to data stores and delivery.', flow: ['Frontend', 'Backend', 'API', 'Database', 'AI Model / Agent', 'Response'] },
    { id: '21', stage: 'Build & Production', title: 'Cloud & Application Deployment', description: 'The cloud and application platform concepts used to take software from a repository to accessible infrastructure.', flow: ['Repository', 'Cloud Platform', 'Deploy Preview', 'Cloud Deployment', 'Production'] },
    { id: '22', stage: 'Build & Production', title: 'Development Languages & Frameworks', description: 'The languages and frameworks commonly used to implement the frontend, backend, and AI product stack.', flow: ['Frontend', 'JavaScript / TypeScript', 'React / Next.js', 'Backend', 'Python / FastAPI'] },
  ];
  sections.forEach((section) => { section.label = `${section.id} · ${section.title}`; });

  const renderRow = (row) => `<tr><td><div class="term-cell"><strong>${escapeHtml(row['English Term'])}</strong></div></td><td class="cn-cell">${escapeHtml(row['中文'])}</td><td class="definition">${escapeHtml(row['Simple English'])}</td><td class="beginner">${escapeHtml(row['中文小白理解'])}</td></tr>`;

  function renderSection(section, sectionRows) {
    const headingId = `section-title-${section.id}`;
    const displayRows = [...sectionRows].sort((a, b) => Number(a['Knowledge Order']) - Number(b['Knowledge Order']));
    return `<section class="knowledge-section" id="section-${section.id}" aria-labelledby="${headingId}"><div class="knowledge-section-header"><div><div class="section-kicker">${escapeHtml(section.label)}</div><h3 id="${headingId}">${escapeHtml(section.title)}</h3></div></div><div class="table-shell"><div class="table-scroll"><table class="glossary-table"><caption class="sr-only">${escapeHtml(section.label)} glossary with English term, Chinese term, simple English definition, and beginner Chinese explanation.</caption><thead><tr><th scope="col">English Term</th><th scope="col">中文</th><th scope="col">Simple English</th><th scope="col">中文小白理解</th></tr></thead><tbody>${displayRows.map(renderRow).join('')}</tbody></table></div></div></section>`;
  }

  function renderStage(stage) {
    const stageRows = rows.filter((row) => row['Knowledge Stage'] === stage.key);
    if (!stageRows.length) return '';
    const headingId = `stage-title-${stage.part.replace(/\s+/g, '-').toLowerCase()}`;
    const sectionMarkup = sections.filter((section) => section.stage === stage.key).map((section) => {
      const sectionRows = stageRows.filter((row) => row['Knowledge Section'] === section.label);
      return sectionRows.length ? renderSection(section, sectionRows) : '';
    }).join('');
    return `<section class="stage-block" aria-labelledby="${headingId}"><div class="stage-divider"><div class="stage-index">${escapeHtml(stage.part)}</div><div class="stage-copy"><h2 id="${headingId}">${escapeHtml(stage.title)}</h2></div></div><div class="section-list">${sectionMarkup}</div></section>`;
  }

  knowledgeMap.innerHTML = stages.map((stage) => renderStage(stage)).join('');
})();
</script>
