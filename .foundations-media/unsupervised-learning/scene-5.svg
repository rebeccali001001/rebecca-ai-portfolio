  <text x="112" y="928" font-family="Arial" font-size="21px" font-weight="800" letter-spacing="2" fill="#7fb1ff">KEY IDEA</text><text x="112" y="972" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="25px" font-weight="600" fill="#f7fafc">Unsupervised learning finds structure in data</text><text x="112" y="1007" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="25px" font-weight="600" fill="#f7fafc">without predefined labels; people inspect</text><text x="112" y="1042" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="25px" font-weight="600" fill="#f7fafc">whether the result is useful.</text>
