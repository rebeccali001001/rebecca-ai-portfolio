":"API Integration","zh":"API 集成"},{"term":"API Orchestration","zh":"API 编排"},{"term":"AI Agent","zh":"AI 智能体"},{"term":"Agent System","zh":"智能体系统"},{"term":"Agent Architecture","zh":"智能体架构"},{"term":"Agent Goal","zh":"用户目标"},{"term":"Agent State","zh":"智能体状态"},{"term":"Agent Memory","zh":"智能体记忆"},{"term":"Short-Term Memory","zh":"短期记忆"},{"term":"Long-Term Memory","zh":"长期记忆"},{"term":"Planning","zh":"规划"},{"term":"Plan","zh":"计划"},{"term":"Task Decomposition","zh":"任务分解"},{"term":"Reasoning","zh":"推理"},{"term":"Agent Loop","zh":"智能体循环"},{"term":"Agent-Environment Interaction","zh":"智能体-环境交互"},{"term":"Action","zh":"行动;动作"},{"term":"Observation","zh":"观察结果;观测"},{"term":"Human-in-the-Loop (HITL)","zh":"人在回路（HITL）"},{"term":"Human Oversight","zh":"人工监督"},{"term":"Approval Gate","zh":"审批闸门"},{"term":"Multi-Agent System","zh":"多智能体系统"},{"term":"Agent Collaboration","zh":"智能体协作"},{"term":"Multi-Agent Orchestration","zh":"多智能体编排"},{"term":"Workflow Orchestration","zh":"编排"},{"term":"Agent Framework","zh":"智能体框架"},{"term":"Agents SDK","zh":"智能体 SDK"},{"term":"LangGraph","zh":"LangGraph 智能体框架"},{"term":"AI Assistant","zh":"AI 助手"},{"term":"Chatbot","zh":"聊天机器人"},{"term":"Coding Assistant","zh":"编码助手"},{"term":"Coding Agent","zh":"编程智能体"},{"term":"AI IDE","zh":"AI 集成开发环境"},{"term":"Autocomplete","zh":"自动补全"},{"term":"Computer Use","zh":"计算机操作"},{"term":"Browser Agent","zh":"浏览器智能体"},{"term":"Agentic Coding","zh":"智能体式编码"},{"term":"Repository Context","zh":"代码仓库上下文"},{"term":"Codebase","zh":"代码库"},{"term":"Code Review","zh":"代码审查"},{"term":"AI Workflow Platform","zh":"AI 工作流平台"},{"term":"Workflow Automation","zh":"工作流自动化"},{"term":"Automation Platform","zh":"自动化平台"},{"term":"AI Step","zh":"AI 步骤"},{"term":"LLM Chain","zh":"LLM 链"},{"term":"Trigger","zh":"触发器;触发条件"}]},{"title":"Evaluation & Safety","rows":[{"term":"Evaluation","zh":"评测"},{"term":"Benchmark","zh":"基准测试"},{"term":"Evaluation Metric","zh":"评估指标"},{"term":"Accuracy","zh":"准确率"},{"term":"Precision","zh":"精确率"},{"term":"Recall","zh":"召回率"},{"term":"F1 Score","zh":"F1 分数"},{"term":"Confusion Matrix","zh":"混淆矩阵"},{"term":"Calibration","zh":"校准"},{"term":"Offline Evaluation","zh":"离线评估"},{"term":"Online Evaluation","zh":"在线评估"},{"term":"Human Evaluation","zh":"人工评估"},{"term":"Functional Test","zh":"功能测试"},{"term":"Test Case","zh":"测试案例"},{"term":"Error Rate","zh":"错误率"},{"term":"Failure Mode","zh":"失败模式"},{"term":"Failure Handling","zh":"失败处理"},{"term":"Retry","zh":"重试"},{"term":"Fallback","zh":"备用方案"},{"term":"Timeout","zh":"超时"},{"term":"Error Handling","zh":"错误处理"},{"term":"A/B Test","zh":"A/B 测试"},{"term":"Hallucination","zh":"幻觉"},{"term":"Fabricated Content","zh":"编造内容"},{"term":"Guardrail","zh":"安全护栏"},{"term":"Safety Filter","zh":"安全过滤器"},{"term":"Content Filter","zh":"内容过滤器"},{"term":"Content Moderation","zh":"内容审核"},{"term":"Prompt Injection","zh":"提示词注入"},{"term":"Prompt Leakage","zh":"提示泄露"},{"term":"Jailbreak","zh":"越狱"},{"term":"Red Teaming","zh":"红队测试"},{"term":"Privacy","zh":"隐私"},{"term":"Personally Identifiable Information (PII)","zh":"个人可识别信息（PII）"},{"term":"Permission","zh":"权限"},{"term":"Access Control","zh":"访问控制"},{"term":"Authentication","zh":"身份认证"},{"term":"Authorization","zh":"授权"},{"term":"Least Privilege","zh":"最小权限"},{"term":"Audit Log","zh":"审计日志"},{"term":"Fairness","zh":"公平性"},{"term":"Explainability","zh":"可说明性"},{"term":"Human Review","zh":"人工审核"},{"term":"RLS","zh":"行级安全(RLS)"}]}]}</script>
<script>
(()=>{const data=JSON.parse(document.getElementById('vocabulary-data').textContent);const nav=document.getElementById('nav'),content=document.getElementById('content'),side=document.getElementById('directory'),backdrop=document.getElementById('backdrop'),empty=document.getElementById('empty');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups=data.categories.map((category,i)=>({id:`category-${i}`,title:category.title,rows:category.rows}));
nav.innerHTML=groups.map(g=>`<div class="nav-group" data-group="${g.id}"><a class="nav-link" href="#${g.id}" data-target="${g.id}"><span>${esc(g.title)}</span><small>${g.rows.length}</small></a></div>`).join('');
content.innerHTML=groups.map(g=>`<section class="section" id="${g.id}" data-category><div class="section-title"><h2>${esc(g.title)}</h2><span>${g.rows.length} 个词条</span></div><section class="module" data-module data-group-id="${g.id}" data-label="${esc(g.title.toLowerCase())}"><div class="terms">${g.rows.map(r=>`<div class="term" data-term="${esc((r.term+' '+r.zh).toLowerCase())}"><span><span class="term-en">${esc(r.term)}</span><span class="term-zh" hidden>${esc(r.zh)}</span></span><button class="speaker" type="button" aria-label="朗读 ${esc(r.term)}">🔊</button></div>`).join('')}</div></section></section>`).join('');
function filter(q){q=q.trim().toLowerCase();let visible=0;document.querySelectorAll('[data-module]').forEach(m=>{let matches=0;m.querySelectorAll('[data-term]').forEach(t=>{const ok=!q||t.dataset.term.includes(q);t.hidden=!ok;if(ok)matches++});m.hidden=matches===0;m.closest("[data-category]").hidden=matches===0;visible+=matches});document.querySelectorAll('.nav-link').forEach(a=>{const m=document.getElementById(a.dataset.target);a.hidden=!m||m.hidden});document.querySelectorAll('.nav-group').forEach(g=>{const id=g.dataset.group;g.hidden=!!q&&!Array.from(document.querySelectorAll(`[data-module][data-group-id="${id}"]`)).some(m=>!m.hidden)});empty.style.display=visible?'none':'block'}
const searches=[document.getElementById('sideSearch'),document.getElementById('mobileSearch')];searches.forEach(input=>input.addEventListener('input',()=>{searches.forEach(other=>{if(other!==input)other.value=input.value});filter(input.value)}));

document.querySelectorAll('.nav-link').forEach(a=>a.addEventListener('click',()=>{side.classList.remove('open');backdrop.classList.remove('show')}));
document.getElementById('openMenu').addEventListener('click',()=>{side.classList.add('open');backdrop.classList.add('show')});backdrop.addEventListener('click',()=>{side.classList.remove('open');backdrop.classList.remove('show')});
document.getElementById('showChinese').addEventListener('change',e=>document.querySelectorAll('.term-zh').forEach(el=>el.hidden=!e.target.checked));
let playTimer=null;const speak=(term)=>{if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(term);utterance.lang='en-US';utterance.rate=parseFloat(document.getElementById('speed').value)||1;window.speechSynthesis.speak(utterance)};
const favoriteKey='it-vocabulary-favorites-v1';let favorites=new Set(JSON.parse(localStorage.getItem(favoriteKey)||'[]'));document.querySelectorAll('.term').forEach(card=>{const word=card.querySelector('.term-en').textContent;if(favorites.has(word)){card.classList.add('favorite');card.querySelector('.speaker').setAttribute('aria-pressed','true')}});document.querySelectorAll('.speaker').forEach(b=>b.addEventListener('click',()=>{const card=b.closest('.term'),word=card.querySelector('.term-en').textContent;if(favorites.has(word)){favorites.delete(word);card.classList.remove('favorite');b.setAttribute('aria-pressed','false')}else{favorites.add(word);card.classList.add('favorite');b.setAttribute('aria-pressed','true')}localStorage.setItem(favoriteKey,JSON.stringify([...favorites]));speak(word)}));
document.getElementById('playAll').addEventListener('click',e=>{if(playTimer){clearInterval(playTimer);playTimer=null;e.currentTarget.textContent='▶ 播放学习';window.speechSynthesis?.cancel();return}const terms=[...document.querySelectorAll('.term:not([hidden]) .term-en')];let i=0;e.currentTarget.textContent='❚❚ 暂停播放';const next=()=>{if(i>=terms.length){clearInterval(playTimer);playTimer=null;e.currentTarget.textContent='▶ 播放学习';return}speak(terms[i++].textContent)};next();playTimer=setInterval(next,Math.max(800,2100/(parseFloat(document.getElementById('speed').value)||1)))});
document.querySelectorAll('[data-practice]').forEach(b=>b.addEventListener('click',()=>{const words=[...document.querySelectorAll('.term:not([hidden]) .term-en')];if(!words.length)return;const mode=b.dataset.practice;const word=words[Math.floor(Math.random()*words.length)].textContent;if(mode==='pronunciation')speak(word);else{const answer=prompt(`拼写练习：请输入听到的单词\n（将播放发音）`);speak(word);if(answer!==null)alert(answer.trim().toLowerCase()===word.toLowerCase()?'正确！':'再试一次。')}}));
})();
</script></body></html>
